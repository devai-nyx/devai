name: Round gates

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: round-gates-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  regression:
    name: T4 / regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/r7-pnpm-setup
        with:
          telemetry-file: scratch/r7-ci/t4/telemetry.json
      - run: mkdir -p scratch/r7-ci/t4
      - name: Start T4 timing
        run: node scripts/r7-ci-telemetry.mjs --file scratch/r7-ci/t4/telemetry.json --operation start --span gate-t4
      - name: Execute T4
        id: t4
        run: pnpm run test:t4
      - name: Finish T4 timing
        if: always()
        run: node scripts/r7-ci-telemetry.mjs --file scratch/r7-ci/t4/telemetry.json --operation finish --span gate-t4 --status "${{ steps.t4.outcome }}"
      - name: Publish non-authoritative T4 report
        if: always()
        uses: ./.github/actions/r7-report
        with:
          report-directory: scratch/r7-ci/t4
          artifact-name: r7-t4-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  smoke-e2e:
    name: T5 / smoke and E2E
    needs: regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/r7-pnpm-setup
        with:
          telemetry-file: scratch/r7-ci/t5/telemetry.json
      - run: mkdir -p scratch/r7-ci/t5
      - name: Start T5 build-boundary timing
        run: node scripts/r7-ci-telemetry.mjs --file scratch/r7-ci/t5/telemetry.json --operation start --span gate-t5-build
      - name: Preserve build boundary before T5
        id: t5-build
        run: pnpm run build
      - name: Finish T5 build-boundary timing
        if: always()
        run: node scripts/r7-ci-telemetry.mjs --file scratch/r7-ci/t5/telemetry.json --operation finish --span gate-t5-build --status "${{ steps.t5-build.outcome }}"
      - name: Start T5 timing
        if: steps.t5-build.outcome == 'success'
        run: node scripts/r7-ci-telemetry.mjs --file scratch/r7-ci/t5/telemetry.json --operation start --span gate-t5
      - name: Execute T5
        id: t5
        run: pnpm run test:t5
      - name: Finish T5 timing
        if: always() && steps.t5.outcome != 'skipped'
        run: node scripts/r7-ci-telemetry.mjs --file scratch/r7-ci/t5/telemetry.json --operation finish --span gate-t5 --status "${{ steps.t5.outcome }}"
      - name: Publish non-authoritative T5 report
        if: always()
        uses: ./.github/actions/r7-report
        with:
          report-directory: scratch/r7-ci/t5
          artifact-name: r7-t5-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  containment:
    name: T6 / containment
    needs: smoke-e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/r7-pnpm-setup
        with:
          telemetry-file: scratch/r7-ci/t6/telemetry.json
      - run: mkdir -p scratch/r7-ci/t6
      - name: Start T6 timing
        run: node scripts/r7-ci-telemetry.mjs --file scratch/r7-ci/t6/telemetry.json --operation start --span gate-t6
      - name: Execute T6
        id: t6
        run: pnpm run test:t6
      - name: Finish T6 timing
        if: always()
        run: node scripts/r7-ci-telemetry.mjs --file scratch/r7-ci/t6/telemetry.json --operation finish --span gate-t6 --status "${{ steps.t6.outcome }}"
      - name: Publish non-authoritative T6 report
        if: always()
        uses: ./.github/actions/r7-report
        with:
          report-directory: scratch/r7-ci/t6
          artifact-name: r7-t6-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
