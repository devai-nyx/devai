name: Reusable local-evidence gate

on:
  workflow_call:
    inputs:
      trusted-actors:
        description: Space, comma, or semicolon separated trusted GitHub actors
        required: true
        type: string
    outputs:
      evidence-mode:
        description: Whether an exact, fresh, policy-valid claim was accepted
        value: ${{ jobs.verify.outputs.evidence-mode }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      evidence-mode: ${{ steps.verify.outputs.evidence_mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/r7-pnpm-setup
        with:
          telemetry-file: scratch/r7-ci/evidence/telemetry.json
      - run: mkdir -p scratch/r7-ci/evidence
      - name: Start preparation timing
        run: node scripts/r7-ci-telemetry.mjs --file scratch/r7-ci/evidence/telemetry.json --operation start --span gate-preparation
      - run: pnpm run devai:prepare
        id: preparation
      - name: Finish preparation timing
        if: always()
        run: node scripts/r7-ci-telemetry.mjs --file scratch/r7-ci/evidence/telemetry.json --operation finish --span gate-preparation --status "${{ steps.preparation.outcome }}"
      - name: Start evidence-verification timing
        if: steps.preparation.outcome == 'success'
        run: node scripts/r7-ci-telemetry.mjs --file scratch/r7-ci/evidence/telemetry.json --operation start --span gate-evidence-verification
      - id: verify
        name: Verify local evidence without granting artifact authority
        env:
          LOCAL_EVIDENCE_TRUSTED_ACTORS: ${{ inputs.trusted-actors }}
        run: pnpm devai evidence local verify --mode gate >> "$GITHUB_OUTPUT"
      - name: Finish evidence-verification timing
        if: always() && steps.verify.outcome != 'skipped'
        run: node scripts/r7-ci-telemetry.mjs --file scratch/r7-ci/evidence/telemetry.json --operation finish --span gate-evidence-verification --status "${{ steps.verify.outcome }}"
      - name: Publish non-authoritative evidence-verification report
        if: always()
        uses: ./.github/actions/r7-report
        with:
          report-directory: scratch/r7-ci/evidence
          artifact-name: r7-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
