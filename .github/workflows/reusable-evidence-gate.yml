name: Reusable local-evidence gate

on:
  workflow_call:
    inputs:
      trusted-actors:
        description: Space, comma, or semicolon separated trusted GitHub actors
        required: true
        type: string
    outputs:
      evidence-mode:
        description: Whether an exact, fresh, policy-valid claim was accepted
        value: ${{ jobs.verify.outputs.evidence-mode }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      evidence-mode: ${{ steps.verify.outputs.evidence_mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: node scripts/prewarm-package-managers.mjs
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run devai:prepare
      - id: verify
        env:
          LOCAL_EVIDENCE_TRUSTED_ACTORS: ${{ inputs.trusted-actors }}
        run: pnpm devai evidence local verify --mode gate >> "$GITHUB_OUTPUT"
