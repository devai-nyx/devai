name: R-0007 cold sentinel

on:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7-cold-sentinel-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  complete-cold-sentinel:
    name: Complete 16-command cold comparison
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEVAI_DB_TESTS: '1'
      DEVAI_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Check out exact authoritative candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up frozen dependencies with acquisition-only cache
        uses: ./.github/actions/r7-pnpm-setup
        with:
          cache-enabled: 'false'
          telemetry-file: scratch/r7-ci/cold-sentinel/telemetry.json

      - name: Create sentinel report directory
        run: mkdir -p scratch/r7-ci/cold-sentinel

      - name: Bind exact base and candidate
        id: range
        run: >-
          node scripts/r7-ci-resolve-range.mjs
          --repo-root .
          --event-path "$GITHUB_EVENT_PATH"
          --output "$GITHUB_OUTPUT"

      - name: Derive prediction for this exact candidate
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          CANDIDATE_SHA: ${{ steps.range.outputs.candidate }}
        run: >-
          node scripts/derive-commit-validation-plan.mjs
          --repo-root .
          --round R-0007
          --base "$BASE_SHA"
          --candidate "$CANDIDATE_SHA"
          --json
          > scratch/r7-ci/cold-sentinel/plan.json

      - name: Cold 01 / formatting
        continue-on-error: true
        run: node scripts/r7-ci-cold-sentinel.mjs --execute formatting --ordinal 1 --records scratch/r7-ci/cold-sentinel/commands -- pnpm exec prettier --check .
      - name: Cold 02 / preparation
        continue-on-error: true
        run: node scripts/r7-ci-cold-sentinel.mjs --execute preparation --ordinal 2 --records scratch/r7-ci/cold-sentinel/commands -- pnpm run devai:prepare
      - name: Cold 03 / action registry
        continue-on-error: true
        run: node scripts/r7-ci-cold-sentinel.mjs --execute action-registry --ordinal 3 --records scratch/r7-ci/cold-sentinel/commands -- pnpm run action-registry:check
      - name: Cold 04 / trace
        continue-on-error: true
        run: node scripts/r7-ci-cold-sentinel.mjs --execute trace --ordinal 4 --records scratch/r7-ci/cold-sentinel/commands -- pnpm run trace:check
      - name: Cold 05 / repository references
        continue-on-error: true
        run: node scripts/r7-ci-cold-sentinel.mjs --execute repository-references --ordinal 5 --records scratch/r7-ci/cold-sentinel/commands -- pnpm run repository-reference:check
      - name: Cold 06 / materializations
        continue-on-error: true
        run: node scripts/r7-ci-cold-sentinel.mjs --execute materializations --ordinal 6 --records scratch/r7-ci/cold-sentinel/commands -- node scripts/run-round-close-controls.mjs control-attestation --round R-0007
      - name: Cold 07 / diff check
        continue-on-error: true
        run: node scripts/r7-ci-cold-sentinel.mjs --execute diff-check --ordinal 7 --records scratch/r7-ci/cold-sentinel/commands -- git diff --check
      - name: Cold 08 / ordinary
        continue-on-error: true
        run: node scripts/r7-ci-cold-sentinel.mjs --execute ordinary --ordinal 8 --records scratch/r7-ci/cold-sentinel/commands -- pnpm vitest run
      - name: Cold 09 / stage 1
        continue-on-error: true
        run: node scripts/r7-ci-cold-sentinel.mjs --execute stage1 --ordinal 9 --records scratch/r7-ci/cold-sentinel/commands -- pnpm run ci:stage1
      - name: Cold 10 / stage 2
        continue-on-error: true
        run: node scripts/r7-ci-cold-sentinel.mjs --execute stage2 --ordinal 10 --records scratch/r7-ci/cold-sentinel/commands -- pnpm run ci:stage2
      - name: Cold 11 / T4
        continue-on-error: true
        run: node scripts/r7-ci-cold-sentinel.mjs --execute t4 --ordinal 11 --records scratch/r7-ci/cold-sentinel/commands -- pnpm run test:t4
      - name: Cold 12 / T5
        continue-on-error: true
        run: node scripts/r7-ci-cold-sentinel.mjs --execute t5 --ordinal 12 --records scratch/r7-ci/cold-sentinel/commands -- pnpm run test:t5
      - name: Cold 13 / T6
        continue-on-error: true
        run: node scripts/r7-ci-cold-sentinel.mjs --execute t6 --ordinal 13 --records scratch/r7-ci/cold-sentinel/commands -- pnpm run test:t6
      - name: Cold 14 / changesets
        continue-on-error: true
        run: node scripts/r7-ci-cold-sentinel.mjs --execute changesets --ordinal 14 --records scratch/r7-ci/cold-sentinel/commands -- pnpm run ci:changesets
      - name: Cold 15 / coverage
        continue-on-error: true
        run: node scripts/r7-ci-cold-sentinel.mjs --execute coverage --ordinal 15 --records scratch/r7-ci/cold-sentinel/commands -- pnpm run test:coverage:t1-t3
      - name: Cold 16 / governance
        continue-on-error: true
        run: node scripts/r7-ci-cold-sentinel.mjs --execute governance --ordinal 16 --records scratch/r7-ci/cold-sentinel/commands -- pnpm run ci:governance

      - name: Build same-candidate predicted and cold observation
        if: always() && steps.range.outcome == 'success'
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          CANDIDATE_SHA: ${{ steps.range.outputs.candidate }}
        run: >-
          node scripts/r7-ci-cold-sentinel.mjs
          --finalize true
          --repo-root .
          --policy law/policy/round-close-controls.json
          --plan scratch/r7-ci/cold-sentinel/plan.json
          --records scratch/r7-ci/cold-sentinel/commands
          --observation scratch/r7-ci/cold-sentinel/observation.json
          --base "$BASE_SHA"
          --candidate "$CANDIDATE_SHA"

      - name: Compare prediction with same-candidate cold observation
        if: always() && steps.range.outcome == 'success'
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          CANDIDATE_SHA: ${{ steps.range.outputs.candidate }}
        run: >-
          node scripts/derive-commit-validation-plan.mjs
          --repo-root .
          --round R-0007
          --base "$BASE_SHA"
          --candidate "$CANDIDATE_SHA"
          --json
          --sentinel-observation scratch/r7-ci/cold-sentinel/observation.json
          > scratch/r7-ci/cold-sentinel/comparison.json

      - name: Enforce predicted and cold success independently of transported bytes
        if: always() && steps.range.outcome == 'success'
        run: >-
          node scripts/r7-ci-cold-sentinel.mjs
          --repo-root .
          --observation scratch/r7-ci/cold-sentinel/observation.json
          --assert true

      - name: Publish non-authoritative cold-sentinel observation
        if: always()
        uses: ./.github/actions/r7-report
        with:
          report-directory: scratch/r7-ci/cold-sentinel
          artifact-name: r7-cold-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
