name: R-0007 pnpm setup
description: Restore acquisition-only pnpm store bytes and perform an unconditional frozen install

inputs:
  cache-enabled:
    description: Permit the acquisition cache when the event is not an untrusted fork pull request
    required: false
    default: 'false'
  telemetry-file:
    description: Repository-relative JSON path for truthful runner-local setup and job timing
    required: true

outputs:
  cache-enabled:
    description: Whether this invocation was eligible to read or write the acquisition cache
    value: ${{ inputs.cache-enabled }}
  cache-hit:
    description: Acquisition-cache lookup result; it never carries gate or PASS authority
    value: ${{ steps.pnpm-store-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Require caller checkout
      shell: bash
      run: |
        set -euo pipefail
        test -d .git || {
          echo 'CI_SETUP_CALLER_CHECKOUT_REQUIRED: checkout must precede the local setup action' >&2
          exit 1
        }
        test -f pnpm-lock.yaml || {
          echo 'CI_SETUP_LOCKFILE_REQUIRED: pnpm-lock.yaml is absent from the checked-out candidate' >&2
          exit 1
        }

    - name: Start runner-local job and setup timing
      shell: bash
      run: |
        node scripts/r7-ci-telemetry.mjs --file "${{ inputs.telemetry-file }}" --operation start --span job-observed-after-checkout
        node scripts/r7-ci-telemetry.mjs --file "${{ inputs.telemetry-file }}" --operation start --span setup
        node scripts/r7-ci-telemetry.mjs --file "${{ inputs.telemetry-file }}" --operation start --span setup-node

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .node-version

    - name: Finish runner-local Node setup timing
      if: always()
      shell: bash
      run: >-
        node scripts/r7-ci-telemetry.mjs
        --file "${{ inputs.telemetry-file }}"
        --operation finish
        --span setup-node
        --status observed

    - name: Enable candidate-bound package manager
      shell: bash
      run: corepack enable

    - name: Resolve pnpm content-addressed store
      id: pnpm-store
      shell: bash
      run: |
        echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Start acquisition-cache timing
      shell: bash
      run: >-
        node scripts/r7-ci-telemetry.mjs
        --file "${{ inputs.telemetry-file }}"
        --operation start
        --span acquisition-cache

    - name: Restore acquisition-only pnpm store cache
      id: pnpm-store-cache
      if: inputs.cache-enabled == 'true'
      uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: r7-pnpm-store-${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.node-version') }}-pnpm-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc') }}-${{ steps.pnpm-store.outputs.candidate }}

    - name: Finish acquisition-cache timing
      if: always()
      shell: bash
      env:
        CACHE_STATUS: ${{ inputs.cache-enabled == 'true' && steps.pnpm-store-cache.outputs.cache-hit || 'disabled-or-miss' }}
      run: >-
        node scripts/r7-ci-telemetry.mjs
        --file "${{ inputs.telemetry-file }}"
        --operation finish
        --span acquisition-cache
        --status "$CACHE_STATUS"

    - name: Start frozen-install timing
      shell: bash
      run: >-
        node scripts/r7-ci-telemetry.mjs
        --file "${{ inputs.telemetry-file }}"
        --operation start
        --span install

    - name: Frozen dependency installation
      id: frozen-install
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Finish frozen-install and setup timing
      if: always()
      shell: bash
      env:
        INSTALL_STATUS: ${{ steps.frozen-install.outcome }}
      run: |
        node scripts/r7-ci-telemetry.mjs --file "${{ inputs.telemetry-file }}" --operation finish --span install --status "$INSTALL_STATUS"
        node scripts/r7-ci-telemetry.mjs --file "${{ inputs.telemetry-file }}" --operation finish --span setup --status "$INSTALL_STATUS"
