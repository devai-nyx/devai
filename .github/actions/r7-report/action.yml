name: R-0007 bounded report
description: Digest, summarize, and upload non-authoritative CI report transport

inputs:
  report-directory:
    description: Candidate-bound report directory beneath the workspace
    required: true
  artifact-name:
    description: Immutable-run artifact name; existence never carries PASS authority
    required: true

runs:
  using: composite
  steps:
    - name: Finish runner-local job timing
      if: always()
      shell: bash
      env:
        JOB_STATUS: ${{ job.status }}
      run: >-
        node scripts/r7-ci-telemetry.mjs
        --file "${{ inputs.report-directory }}/telemetry.json"
        --operation finish
        --span job-observed-after-checkout
        --status "$JOB_STATUS"

    - name: Build bounded digest manifest and workflow summary
      if: always()
      shell: bash
      run: >-
        node scripts/r7-ci-build-report.mjs
        --directory "${{ inputs.report-directory }}"
        --summary "$GITHUB_STEP_SUMMARY"
        --coverage-directory scratch/coverage/t1-t3
        --max-files 128
        --max-bytes 16777216

    - name: Upload digest-bound non-authoritative report transport
      if: always()
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.report-directory }}
        if-no-files-found: error
        retention-days: 7
        compression-level: 6
        overwrite: false
        include-hidden-files: true
